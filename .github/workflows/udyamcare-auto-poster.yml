name: UdyamCare Auto Poster

on:
  schedule:
    - cron: "30 2 * * *"    # 8:00 AM IST - Registration
    - cron: "30 6 * * *"    # 12:00 PM IST - Loan & Finance
    - cron: "30 10 * * *"   # 4:00 PM IST - Business Idea
    - cron: "30 14 * * *"   # 8:00 PM IST - Business Tips

  workflow_dispatch:
    inputs:
      slot:
        description: "Choose post category for manual test"
        required: true
        type: choice
        options:
          - registration
          - loan
          - idea
          - tips

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Determine post slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)

            # GitHub scheduled workflows can start late.
            # Allow a 2-hour window so delayed triggers still
            # publish the intended post category.
            case "$HOUR" in
              02|03)
                echo "slot=registration" >> "$GITHUB_OUTPUT"
                ;;
              06|07)
                echo "slot=loan" >> "$GITHUB_OUTPUT"
                ;;
              10|11)
                echo "slot=idea" >> "$GITHUB_OUTPUT"
                ;;
              14|15)
                echo "slot=tips" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "slot=" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

      - name: Publish UdyamCare Post
        if: steps.slot.outputs.slot != ''
        run: |
          echo "Publishing: ${{ steps.slot.outputs.slot }}"

          curl --fail-with-body -X POST \
            "https://udyamcare-auto-poster.floot.app/_api/auto/${{ steps.slot.outputs.slot }}"
