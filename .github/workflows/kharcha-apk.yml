name: Build Kharcha APK

on:
  workflow_dispatch:
  push:
    paths:
      - "kharcha-app/**"
      - ".github/workflows/kharcha-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kharcha-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests (SMS parser)
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kharcha-debug-apk
          path: kharcha-app/app/build/outputs/apk/debug/app-debug.apk
