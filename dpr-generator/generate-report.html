  <script>
    // Wait for scripts to load

      try {
        // Compute the financial model
        const model = DPRCalc.compute(customerData);

        if (model.errors.length > 0) {
          alert('Errors in form data:\n' + model.errors.join('\n'));
          return;
        }

        if (model.warnings.length > 0) {
          console.warn('Warnings:', model.warnings);
        }

        // Generate HTML report
        const reportHtml = DPRReport.render(model);
        document.getElementById('report').innerHTML = reportHtml;
        document.querySelector('p').textContent = 'Report generated! Use Print to save as PDF.';

        // Print the report
        setTimeout(() => { window.print(); }, 500);
      } catch (err) {
